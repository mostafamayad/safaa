<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حمدي & صفاء — دعوتكم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="audio-btn" aria-label="Play Music">♫</button>

<!-- Section 1: Intro (Envelope) -->
<section class="sec" id="sec-intro">
  <img src="assets/bg_envelope.jpg" alt="" class="bg-img">
  <div class="overlay"></div>
  <div class="content">
    <h1 class="intro-names fade-up">حمدي <span>&amp;</span> صفاء</h1>
    <div class="intro-sub fade-up delay-1">30 . 08 . 2026</div>
  </div>
  <div class="scroll-indicator fade-up delay-2">افتح الدعوة</div>
</section>

<!-- Section 2: Countdown (Clock) -->
<section class="sec" id="sec-countdown">
  <img src="assets/bg_clock.jpg" alt="" class="bg-img" style="object-position: center bottom;">
  <div class="overlay"></div>
  <div class="content">
    <h2 class="cd-title fade-up">موعدنا يقترب...</h2>
    <div class="countdown-wrapper fade-up delay-1">
      <div class="cd-box">
        <div class="cd-num" id="d">00</div>
        <div class="cd-label">Days</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="h">00</div>
        <div class="cd-label">Hours</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="m">00</div>
        <div class="cd-label">Mins</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="s">00</div>
        <div class="cd-label">Secs</div>
      </div>
    </div>
  </div>
</section>

<!-- Section 3: Venue (Palace) -->
<section class="sec" id="sec-venue">
  <img src="assets/bg_palace.jpg" alt="" class="bg-img" style="object-position: center top;">
  <div class="overlay"></div>
  <div class="content">
    <h2 class="venue-name fade-up">HEAVEN HALL</h2>
    <p class="venue-desc fade-up delay-1">حيث نكتب فصلاً جديداً من قصتنا<br><span style="font-size: 0.8em; color: #aaa; margin-top: 10px; display: inline-block;">محلة روح - طنطا - الغربية</span></p>
    <a href="https://maps.app.goo.gl/m1myxHRVWV83SH6XA?g_st=ic" target="_blank" class="btn-gold fade-up delay-2">استكشف المكان</a>
  </div>
</section>

<!-- Section 4: Finale (Stars) -->
<section class="sec" id="sec-finale">
  <img src="assets/bg_stars.jpg" alt="" class="bg-img">
  <div class="overlay"></div>
  <div class="content">
    <div class="fin-monogram fade-up">H+S</div>
    <p class="fin-text fade-up delay-1">والحكاية لسه بتبدأ...</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
