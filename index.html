<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030614">
    <title>دعوة خطوبة | حمدي وصفاء</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Aref+Ruqaa+Ink:wght@400;700&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- Audio Player -->
    <audio id="bg-music" loop preload="auto">
        <source src="assets/romantic.mp3" type="audio/mpeg">
    </audio>
    <button id="music-btn" class="music-btn" aria-label="Music">
        <div class="mb-bars"><div class="mb-b"></div><div class="mb-b"></div><div class="mb-b"></div><div class="mb-b"></div></div>
    </button>

    <div class="scroll-instruction">
        <span>اسحب لتبدأ الرحلة</span>
        <div class="scroll-line"></div>
    </div>

    <!-- MAIN SCROLL CONTAINER -->
    <div id="cinema-container">
        <!-- Canvas for Stars -->
        <canvas id="stars"></canvas>

        <!-- Background Image (Palace) -->
        <div id="palace-bg" style="background-image: url('assets/hall.jpg')"></div>
        <div id="palace-overlay"></div>

        <!-- Texts -->
        <div id="text-1" class="cinema-text">في ليلة من أجمل الليالي...</div>
        <div id="text-2" class="cinema-text">التقى النور بالنور...</div>

        <!-- The Light Orbs (Representing Hamdy & Safaa) -->
        <div id="orb-h" class="orb orb-gold"><div class="orb-name">حمدي</div></div>
        <div id="orb-s" class="orb orb-silver"><div class="orb-name">صفاء</div></div>

        <!-- The Light Flash -->
        <div id="flash"></div>

        <!-- The Final Invitation Card -->
        <div id="invitation-card" class="premium-card">
            
            <div class="card-crown">✧ ✧ ✧</div>
            
            <!-- Real Photos -->
            <div class="couple-photos">
                <div class="c-photo ph-h"><img src="assets/hamdy_real.jpg" alt="حمدي"></div>
                <div class="c-photo ph-s"><img src="assets/safaa_real.jpg" alt="صفاء"></div>
            </div>

            <!-- Names -->
            <h1 class="card-names">حمدي <span class="amp">&amp;</span> صفاء</h1>
            <p class="card-event">حفل الخطوبة</p>

            <div class="card-divider"></div>

            <!-- Details -->
            <div class="card-details">
                <div class="cd-row">
                    <span class="cd-icon">📅</span>
                    <span class="cd-text">الأحد، ٣٠ أغسطس ٢٠٢٦</span>
                </div>
                <div class="cd-row">
                    <span class="cd-icon">🕗</span>
                    <span class="cd-text">الساعة ٨:٠٠ مساءً</span>
                </div>
                <div class="cd-row">
                    <span class="cd-icon">📍</span>
                    <span class="cd-text">قاعة HEAVEN HALL - محلة روح</span>
                </div>
            </div>

            <!-- Countdown -->
            <div class="card-countdown">
                <div class="cbox"><div id="c-days" class="cnum">00</div><div class="clbl">يوم</div></div>
                <div class="cbox"><div id="c-hours" class="cnum">00</div><div class="clbl">ساعة</div></div>
                <div class="cbox"><div id="c-mins" class="cnum">00</div><div class="clbl">دقيقة</div></div>
                <div class="cbox"><div id="c-secs" class="cnum">00</div><div class="clbl">ثانية</div></div>
            </div>

            <!-- Map Button -->
            <a href="https://maps.app.goo.gl/m1myxHRVWV83SH6XA?g_st=ic" target="_blank" class="card-map-btn">
                افتح الخريطة للوصول
            </a>

            <div class="card-footer">في انتظاركم لتكتمل فرحتنا 🤍</div>
        </div>

    </div>

    <!-- Scripts -->
    <!-- Lenis for ultra-smooth scrolling -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <!-- GSAP for timeline animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
